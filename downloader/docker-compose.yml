services:
  baixador:
    build: .
    restart: unless-stopped
    environment:
      ACCESS_KEY: ${ACCESS_KEY:-}
    volumes:
      - ./cookies:/data:ro   # opcional: cookies/cookies.txt
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - baixador

volumes:
  caddy_data:
