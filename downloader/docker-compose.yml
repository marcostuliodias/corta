services:
  baixador:
    build: .
    restart: unless-stopped
    environment:
      ACCESS_KEY: ${ACCESS_KEY:-}
    volumes:
      - ./cookies:/data:ro   # opcional: cookies/cookies.txt
    ports:
      - "8787:8080"   # teste: http://IP-DA-VPS:8787

  # HTTPS com domínio (opcional): docker compose --profile https up -d
  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - baixador

volumes:
  caddy_data:
