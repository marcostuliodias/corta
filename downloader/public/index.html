<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baixador</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --txt:#eef0f4; --mut:#8b93a3; --acc:#4f8cff; --err:#ff6b6b; --ok:#3ddc97; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f5f6f8; --card:#fff; --line:#dde1e8; --txt:#14171c; --mut:#5d6675; --acc:#2563eb; --err:#d92d2d; --ok:#14935f; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
         background:var(--bg); color:var(--txt); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { width:100%; max-width:640px; }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  p.sub { margin:0 0 20px; color:var(--mut); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  input[type=text], input[type=password] { flex:1 1 260px; min-width:0; padding:12px 14px; font:inherit; color:var(--txt);
         background:var(--bg); border:1px solid var(--line); border-radius:10px; }
  input:focus { outline:2px solid var(--acc); outline-offset:1px; }
  button { padding:12px 20px; font:inherit; font-weight:600; color:#fff; background:var(--acc); border:0; border-radius:10px; cursor:pointer; }
  button:disabled { opacity:.55; cursor:default; }
  .modes { display:flex; gap:16px; margin-top:12px; color:var(--mut); font-size:.95rem; }
  .modes label { display:flex; gap:6px; align-items:center; cursor:pointer; }
  .bar { height:8px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:16px; display:none; }
  .bar i { display:block; height:100%; width:0; background:var(--acc); transition:width .3s; }
  #msg { margin-top:12px; min-height:1.5em; color:var(--mut); font-size:.95rem; word-break:break-word; }
  #msg.err { color:var(--err); } #msg.ok { color:var(--ok); }
  a.link { color:var(--acc); } .small { margin-top:14px; font-size:.85rem; color:var(--mut); }
  #keybox { display:none; margin-top:16px; }
</style>
</head>
<body>
<main>
  <h1>Baixador</h1>
  <p class="sub">Cole o link do vídeo e baixe. Nada fica salvo no servidor.</p>

  <div class="card">
    <form id="f" class="row">
      <input id="url" type="text" inputmode="url" placeholder="https://… (YouTube, Shorts, Reels, TikTok…)" autocomplete="off" required>
      <button id="go" type="submit">Baixar</button>
    </form>
    <div class="modes">
      <label><input type="radio" name="mode" value="mp4" checked> Vídeo (MP4)</label>
      <label><input type="radio" name="mode" value="mp3"> Só áudio (MP3)</label>
    </div>
    <div class="bar" id="bar"><i id="fill"></i></div>
    <div id="msg" role="status" aria-live="polite"></div>

    <form id="keybox" class="row">
      <input id="key" type="password" placeholder="Senha de acesso" autocomplete="current-password">
      <button type="submit">Entrar</button>
    </form>
  </div>
  <p class="small">Baixe apenas conteúdo seu ou que você tem permissão para baixar.</p>
</main>

<script>
const $ = (id) => document.getElementById(id);
let key = "";
try { key = localStorage.getItem("baixador-key") || ""; } catch {}

const setMsg = (t, cls = "") => { $("msg").textContent = t; $("msg").className = cls; };
const setBar = (p) => { $("bar").style.display = p == null ? "none" : "block"; $("fill").style.width = (p || 0) + "%"; };
const busy = (b) => { $("go").disabled = b; };

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { ...(opts.headers || {}), "x-key": key } });
  if (r.status === 401) { askKey("Senha incorreta ou ausente."); throw new Error("auth"); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || "Erro " + r.status);
  return data;
}

function askKey(m) {
  $("keybox").style.display = "flex";
  setMsg(m, "err"); setBar(null); busy(false);
  $("key").focus();
}
$("keybox").addEventListener("submit", (e) => {
  e.preventDefault();
  key = $("key").value.trim();
  try { localStorage.setItem("baixador-key", key); } catch {}
  $("keybox").style.display = "none";
  setMsg("Senha salva. Pode baixar.", "ok");
});

$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const mode = document.querySelector('input[name=mode]:checked').value;
  busy(true); setBar(0); setMsg("Iniciando… (na primeira vez do dia pode levar alguns segundos)");
  try {
    const { id } = await api("/api/start", { method: "POST", body: JSON.stringify({ url: $("url").value.trim(), mode }) });
    for (;;) {
      await new Promise((r) => setTimeout(r, 1000));
      const s = await api("/api/status/" + id);
      if (s.state === "running") { setBar(s.percent); setMsg(`Baixando… ${Math.round(s.percent)}%`); continue; }
      if (s.state === "error") throw new Error(s.error || "Não foi possível baixar este link.");
      setBar(100); setMsg("Pronto! Salvando " + s.filename, "ok");
      const a = document.createElement("a");
      a.href = `/api/file/${id}?key=${encodeURIComponent(key)}`;
      document.body.appendChild(a); a.click(); a.remove();
      break;
    }
  } catch (err) {
    if (err.message !== "auth") { setBar(null); setMsg(err.message, "err"); }
  } finally { busy(false); }
});

</script>
</body>
</html>
